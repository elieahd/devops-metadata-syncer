databaseChangeLog:
  - changeSet:
      id: organization-personal-001
      author: elie.ahd
      changes:
        - insert:
            tableName: organization
            columns:
              - column:
                  name: acronym
                  value: "Personal"
              - column:
                  name: name
                  value: "My Personal Organization"
      rollback:
        - delete:
            tableName: organization
            where: "acronym = 'Personal'"
